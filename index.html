<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Derech Eretz - Earthly Path</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="starfield" aria-hidden="true"></div>
    <main class="card">
      <h1>Derech Eretz</h1>
      <p class="subtitle">Sacred translations and luminous pathways:</p>
      <ul>
        <li>
          <a href="https://docs.google.com/document/d/1_KhqbVtu9IqQZ-IIJMQeCQCgPElxkXHt/edit?usp=share_link&ouid=103695002754294688214&rtpof=true&sd=true" target="_blank" rel="noopener noreferrer">
            אור דרך ארץ
          </a>
        </li>
        <li>
          <a href="https://docs.google.com/document/d/1G4LvHJFtY5KsMVfRG6j4QGm5y1auPwxE/edit?usp=sharing&ouid=103695002754294688214&rtpof=true&sd=true" target="_blank" rel="noopener noreferrer">
            The Light of the Earthly Path
          </a>
        </li>
        <li>
          <a href="https://docs.google.com/document/d/1G4LvHJFtY5KsMVfRG6j4QGm5y1auPwxE/edit?usp=sharing&ouid=103695002754294688214&rtpof=true&sd=true" target="_blank" rel="noopener noreferrer">
            Свет земного пути
          </a>
        </li>
    </ul>
    </br>
    <p class="subtitle">Related Links:</p>
    <ul>
        <li>
          <a href="https://sacredcal.one" target="_blank" rel="noopener noreferrer">
            International Sacred Calendar
          </a>
        </li>
      </ul>
      <p class="signature">May the light be clear and the path be guided.</p>
    </main>
    <script>
      const starfield = document.querySelector('.starfield');
      const starCount = 90;

      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('span');
        star.className = 'star';
        star.style.left = `${Math.random() * 100}%`;
        star.style.top = `${Math.random() * 100}%`;
        star.style.setProperty('--duration', `${2.5 + Math.random() * 3}s`);
        star.style.opacity = `${0.4 + Math.random() * 0.6}`;
        star.style.transform = `scale(${0.7 + Math.random() * 1.2})`;
        starfield.appendChild(star);
      }
    </script>
  </body>
</html>
